name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to release (must match desktop/package.json)
        required: true
        type: string
        default: "0.1.0"

permissions: {}

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid desktop version: $version" >&2
            exit 1
          fi
          package_version="$(node -p "require('./desktop/package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Version $version does not match desktop/package.json ($package_version)" >&2
            exit 1
          fi
          node -e 'const fs = require("node:fs"); const version = process.argv[1]; const compose = fs.readFileSync("desktop/resources/compose.yml", "utf8"); for (const name of ["web", "worker"]) { if (!compose.includes(`ghcr.io/ulinwang/confuse-${name}:${version}`)) throw new Error(`Compose default for ${name} does not match ${version}`); }' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=desktop-v$version" >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "arm64"]
    permissions:
      contents: read
      packages: write
    env:
      CONFUSE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGETARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Docker Buildx
        run: |
          docker buildx create --name confuse-desktop --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish native image
        run: node desktop/scripts/build-images.mjs --push --platform "linux/$TARGETARCH" --tag "$CONFUSE_RELEASE_VERSION-$TARGETARCH"

  manifest:
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CONFUSE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    outputs:
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture manifests
        run: node desktop/scripts/manifest-images.mjs
      - id: visibility
        name: Verify public package access and anonymous pulls
        env:
          GHCR_VISIBILITY_TOKEN: ${{ github.token }}
        run: node desktop/scripts/publish-ghcr.mjs

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Test desktop
        run: pnpm --filter @confuse/desktop test

  smoke:
    needs: [prepare, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      CONFUSE_SMOKE_ISOLATED: "1"
      CONFUSE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Verify Compose, Agent ingestion, and clean shutdown
        run: pnpm --filter @confuse/desktop smoke:runtime

  dmg:
    needs: [prepare, images, test, smoke]
    runs-on: macos-15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    outputs:
      signed: ${{ steps.artifact-mode.outputs.signed }}
      artifact_name: ${{ steps.artifact-mode.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: artifact-mode
        name: Select signed release or unsigned CI artifact mode
        run: |
          mkdir -p desktop/out
          if [[ -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_ID_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=desktop-dmg-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Signed and notarized release candidate" > desktop/out/artifact-kind.txt
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=desktop-dmg-unsigned-$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "UNSIGNED CI ARTIFACT: not signed, not notarized, and not a formal GitHub release" > desktop/out/artifact-kind.txt
            echo "::warning::Apple signing/notarization credentials are incomplete. Building unsigned CI artifacts only; no GitHub release will be created."
          fi
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build macOS DMGs sequentially
        run: pnpm --filter @confuse/desktop make:mac
      - name: Verify exactly one ARM64 and one x64 DMG
        run: node desktop/scripts/verify-dmgs.mjs
      - name: Upload DMG CI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-mode.outputs.artifact_name }}
          path: |
            desktop/out/**/*.dmg
            desktop/out/artifact-kind.txt
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, manifest, dmg]
    if: needs.dmg.outputs.signed == 'true' && needs.manifest.outputs.public == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download signed and notarized DMGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.dmg.outputs.artifact_name }}
          path: release
      - name: Verify release DMGs
        run: node desktop/scripts/verify-dmgs.mjs release
      - name: Publish signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=()
          while IFS= read -r -d '' artifact; do
            artifacts+=("$artifact")
          done < <(find release -type f -name '*.dmg' -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}"
          else
            gh release create "$RELEASE_TAG" "${artifacts[@]}" \
              --target "$GITHUB_SHA" \
              --title "Confuse Desktop $RELEASE_VERSION" \
              --generate-notes
          fi
